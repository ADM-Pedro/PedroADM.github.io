<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diário do DK</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Arial;
  background:#0b1f38;
  color:#fff;
  padding:20px;
}

.container{max-width:500px;margin:0 auto}

.card{
  background:#111827;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.stat{
  background:#1f2937;
  border-radius:10px;
  padding:10px;
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#0f172a;
  color:#fff;
}

button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  font-weight:bold;
}

/* TELA PIX FULL */
#telaPix{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#0b1f38;
  z-index:9999;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
}

</style>
</head>

<body>

<div id="site">

<div class="container">

<div class="card">
<h2>💰 Diário do DK</h2>
<p>Partidas valendo dinheiro</p>

<div class="stats">
<div class="stat">💵 R$5<br>Entrada</div>
<div class="stat">⚔️ +R$3<br>Kill</div>
<div class="stat">🏆 +R$10<br>Vitória</div>
</div>
</div>

<div class="card">
<h3>📝 Entrar</h3>

<form id="form">
<input id="nome" placeholder="Seu nome" required>
<input id="tel" placeholder="Telefone" required>
<input id="nick" placeholder="Nick" required>
<button>Garantir vaga</button>
</form>

<p id="msg"></p>
</div>

</div>
</div>

<!-- TELA PIX -->
<div id="telaPix">

<h2>💸 Finalizar pagamento</h2>

<p><b>Valor: R$5,00</b></p>

<img id="qr" style="width:220px;margin:15px;border-radius:12px;">

<p><b>Chave Pix:</b></p>
<p>11998385244</p>

<button onclick="copiar()">📋 Copiar Pix</button>

<a id="zap" target="_blank" style="width:90%;max-width:300px;">
<button style="background:#25D366;color:#fff;margin-top:15px;">
💬 Já paguei
</button>
</a>

</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbwsBIpdwuovHQakSSfsz5sOFvufFNK3-tHKeWYZ2c2_4bgGZPARAgkW-y3ElwrxzicU/exec";
const PIX = "11998385244";
const TEL = "5511998385244";

const form = document.getElementById("form");

form.addEventListener("submit", async function(e){
  e.preventDefault();

  const nome = document.getElementById("nome").value;
  const tel = document.getElementById("tel").value;
  const nick = document.getElementById("nick").value;

  try{
    const res = await fetch(URL,{
      method:"POST",
      body:JSON.stringify({nome,telefone:tel,nick})
    });

    const txt = await res.text();

    if(txt==="LOTADO") return alert("Sala lotada");
    if(txt==="JA_ENTROU") return alert("Nick já cadastrado");

    abrirPix(nome,nick);

  }catch{
    alert("Erro ao cadastrar");
  }
});

function abrirPix(nome,nick){

  document.getElementById("site").style.display="none";
  const tela = document.getElementById("telaPix");
  tela.style.display="flex";

  document.getElementById("qr").src =
  `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${PIX}`;

  const msg = `Olá, fiz o pagamento do Diário do DK.%0ANome: ${nome}%0ANick: ${nick}`;

  document.getElementById("zap").href =
  `https://wa.me/${TEL}?text=${msg}`;

  localStorage.setItem("pix","1");
  localStorage.setItem("nome",nome);
  localStorage.setItem("nick",nick);
}

function copiar(){
  navigator.clipboard.writeText(PIX);
  alert("Pix copiado!");
}

window.onload = function(){

  if(localStorage.getItem("pix")=="1"){

    document.getElementById("site").style.display="none";

    const tela = document.getElementById("telaPix");
    tela.style.display="flex";

    document.getElementById("qr").src =
    `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${PIX}`;

    const nome = localStorage.getItem("nome");
    const nick = localStorage.getItem("nick");

    const msg = `Olá, fiz o pagamento do Diário do DK.%0ANome: ${nome}%0ANick: ${nick}`;

    document.getElementById("zap").href =
    `https://wa.me/${TEL}?text=${msg}`;
  }

}
</script>

</body>
</html>
