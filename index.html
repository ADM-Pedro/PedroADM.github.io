<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diário do DK</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Arial;
  background:#0b1f38;
  color:#fff;
  padding:20px;
}

.container{max-width:500px;margin:0 auto}

.card{
  background:#111827;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.stat{
  background:#1f2937;
  border-radius:10px;
  padding:10px;
  text-align:center;
}

.progress{
  width:100%;
  height:10px;
  background:#1f2937;
  border-radius:999px;
  margin-top:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0%;
  background:#22c55e;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#0f172a;
  color:#fff;
}

button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  font-weight:bold;
}

ul{
  list-style:none;
  margin-top:10px;
}

li{
  background:#1f2937;
  padding:8px;
  border-radius:8px;
  margin-bottom:6px;
}

/* TELA PIX */
#telaPix{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#0b1f38;
  z-index:9999;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
}
</style>
</head>

<body>

<div id="site">

<div class="container">

<div class="card">
<h2>💰 Diário do DK</h2>
<p>Partidas valendo dinheiro</p>

<div class="stats">
<div class="stat">💵 R$5<br>Entrada</div>
<div class="stat">⚔️ +R$3<br>Kill</div>
<div class="stat">🏆 +R$10<br>Vitória</div>
</div>
</div>

<div class="card">
<h3>🚨 Vagas</h3>
<p><span id="ocupadas">0</span>/9 preenchidas</p>
<p>Restam <span id="restantes">9</span></p>

<div class="progress">
<div class="fill" id="fill"></div>
</div>

<p id="statusSala"></p>
</div>

<div class="card">
<h3>📝 Entrar</h3>

<form id="form">
<input id="nome" placeholder="Seu nome" required>
<input id="tel" placeholder="Telefone" required>
<input id="nick" placeholder="Nick" required>
<button>Garantir vaga</button>
</form>

<p id="msg"></p>
</div>

<div class="card">
<h3>👥 Players</h3>
<ul id="lista"></ul>
</div>

</div>
</div>

<!-- TELA PIX -->
<div id="telaPix">

<h2>💸 Finalizar pagamento</h2>
<p><b>Valor: R$5,00</b></p>

<img id="qr" style="width:220px;margin:15px;border-radius:12px;">

<p><b>Chave Pix:</b></p>
<p>11998385244</p>

<button onclick="copiar()">📋 Copiar Pix</button>

<a id="zap" target="_blank" style="width:90%;max-width:300px;">
<button style="background:#25D366;color:#fff;margin-top:15px;">
💬 Já paguei
</button>
</a>

</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbwsBIpdwuovHQakSSfsz5sOFvufFNK3-tHKeWYZ2c2_4bgGZPARAgkW-y3ElwrxzicU/exec";
const PIX = "11998385244";
const TEL = "5511998385244";
const TOTAL = 9;

function abrirPix(nome,nick){
  document.getElementById("site").style.display="none";
  document.getElementById("telaPix").style.display="flex";

  document.getElementById("qr").src =
  `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${PIX}`;

  const msg = `Olá, fiz o pagamento do Diário do DK.%0ANome: ${nome}%0ANick: ${nick}`;

  document.getElementById("zap").href =
  `https://wa.me/${TEL}?text=${msg}`;

  localStorage.setItem("pix","1");
  localStorage.setItem("nome",nome);
  localStorage.setItem("nick",nick);
}

document.getElementById("form").onsubmit = async (e)=>{
  e.preventDefault();

  const nome = nome.value;
  const tel = tel.value;
  const nick = nick.value;

  const res = await fetch(URL,{
    method:"POST",
    body:JSON.stringify({nome,telefone:tel,nick})
  });

  const txt = await res.text();

  if(txt==="LOTADO") return alert("Sala lotada");
  if(txt==="JA_ENTROU") return alert("Nick já cadastrado");

  abrirPix(nome,nick);
  carregar();
};

function copiar(){
  navigator.clipboard.writeText(PIX);
  alert("Pix copiado!");
}

async function carregar(){
  const res = await fetch(URL);
  const data = await res.json();

  lista.innerHTML="";

  data.forEach(n=>{
    const li=document.createElement("li");
    li.textContent=n;
    lista.appendChild(li);
  });

  ocupadas.textContent=data.length;
  restantes.textContent=TOTAL-data.length;
  fill.style.width=(data.length/TOTAL*100)+"%";

  statusSala.textContent =
  data.length>=TOTAL?"🔥 Sala lotada":
  data.length>=7?"⚠️ Últimas vagas":
  "✅ Vagas abertas";
}

window.onload = ()=>{
  carregar();

  if(localStorage.getItem("pix")=="1"){
    abrirPix(
      localStorage.getItem("nome"),
      localStorage.getItem("nick")
    );
  }
};
</script>

</body>
</html>
