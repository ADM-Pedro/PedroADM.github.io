<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diário do DK</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial;
  background:#0b1f38;
  color:#fff;
  padding:20px;
}
.container{max-width:500px;margin:0 auto}
.card{
  background:#111827;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
}
h1{text-align:center;margin-bottom:8px}
.sub{text-align:center;opacity:.9;margin-bottom:16px}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}
.stat{
  background:#1f2937;
  border-radius:10px;
  padding:10px;
  text-align:center;
}

.progress{
  width:100%;
  height:10px;
  background:#1f2937;
  border-radius:999px;
  overflow:hidden;
  margin-top:10px;
}
.fill{
  height:100%;
  width:0%;
  background:#22c55e;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#0f172a;
  color:#fff;
}
button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:#000;
  font-weight:bold;
}

.copy-btn{
  background:#2563eb;
  color:#fff;
}

.pix-screen{
  text-align:center;
}

.whats-btn{
  background:#25D366;
  color:#fff;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
  <h1>💰 Diário do DK</h1>
  <div class="sub">Partidas de Brawl Stars valendo dinheiro</div>

  <div class="stats">
    <div class="stat">💵 R$5<br>Entrada</div>
    <div class="stat">⚔️ +R$3<br>Kill</div>
    <div class="stat">🏆 +R$10<br>Vitória</div>
  </div>
</div>

<div class="card">
  <h3>🚨 Vagas</h3>
  <p><span id="ocupadas">0</span>/9</p>
  <div class="progress">
    <div class="fill" id="fill"></div>
  </div>
  <p id="statusSala">Carregando...</p>
</div>

<div class="card" id="formCard">
  <h3>📝 Entrar</h3>

  <form id="form">
    <input id="nome" placeholder="Seu nome" required>
    <input id="tel" placeholder="Telefone" required>
    <input id="nick" placeholder="Nick" required>
    <button>Garantir vaga</button>
  </form>
</div>

<div class="card pix-screen" id="pixScreen" style="display:none;">
  <h3>💸 Finalizar pagamento</h3>
  <p><b>Valor: R$5,00</b></p>

  <img id="qr" style="width:200px;margin:15px 0;border-radius:10px;">

  <p id="pix">11998385244</p>

  <button class="copy-btn" onclick="copiar()">📋 Copiar Pix</button>

  <a id="zap" target="_blank">
    <button class="whats-btn">💬 Enviar comprovante</button>
  </a>
</div>

<div class="card">
  <h3>👥 Players</h3>
  <ul id="lista"></ul>
</div>

</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbwsBIpdwuovHQakSSfsz5sOFvufFNK3-tHKeWYZ2c2_4bgGZPARAgkW-y3ElwrxzicU/exec";
const PIX = "11998385244";
const TEL = "5511998385244";

const form = document.getElementById("form");
const pixScreen = document.getElementById("pixScreen");
const formCard = document.getElementById("formCard");

function gerarQR(){
  document.getElementById("qr").src =
  `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${PIX}`;
}

function salvar(nome,nick){
  localStorage.setItem("pix","1");
  localStorage.setItem("nome",nome);
  localStorage.setItem("nick",nick);
}

function carregarPix(){
  if(localStorage.getItem("pix")=="1"){
    abrirPix(
      localStorage.getItem("nome"),
      localStorage.getItem("nick")
    );
  }
}

function abrirPix(nome,nick){
  formCard.style.display="none";
  pixScreen.style.display="block";

  gerarQR();

  const msg = `Olá, fiz o pagamento do Diário do DK.%0ANome: ${nome}%0ANick: ${nick}`;
  document.getElementById("zap").href =
  `https://wa.me/${TEL}?text=${msg}`;
}

form.onsubmit = async (e)=>{
  e.preventDefault();

  const nome = nomeInput.value;
  const tel = telInput.value;
  const nick = nickInput.value;

  const res = await fetch(URL,{
    method:"POST",
    body:JSON.stringify({nome,telefone:tel,nick})
  });

  const txt = await res.text();

  if(txt=="LOTADO") return alert("Sala lotada");
  if(txt=="JA_ENTROU") return alert("Nick já cadastrado");

  salvar(nome,nick);
  abrirPix(nome,nick);
};

function copiar(){
  navigator.clipboard.writeText(PIX);
  alert("Copiado!");
}

async function load(){
  const r = await fetch(URL);
  const d = await r.json();

  lista.innerHTML="";
  d.forEach(n=>{
    const li=document.createElement("li");
    li.textContent=n;
    lista.appendChild(li);
  });

  fill.style.width=(d.length/9*100)+"%";

  statusSala.textContent =
  d.length>=9?"LOTADO":
  d.length>=7?"Últimas vagas":"Aberto";
}

carregarPix();
load();
</script>

</body>
</html>
