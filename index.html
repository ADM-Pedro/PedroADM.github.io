<script>
const URL = "https://script.google.com/macros/s/AKfycbwsBIpdwuovHQakSSfsz5sOFvufFNK3-tHKeWYZ2c2_4bgGZPARAgkW-y3ElwrxzicU/exec";
const PIX = "11998385244";
const TELEFONE = "5511998385244";
const TOTAL = 9;

const form = document.getElementById("cadastroForm");
const msg = document.getElementById("msg");
const lista = document.getElementById("lista");
const ocupadasEl = document.getElementById("ocupadas");
const restantesEl = document.getElementById("restantes");
const fillEl = document.getElementById("fill");
const statusSala = document.getElementById("statusSala");

// NOVO
const pixArea = document.getElementById("pixArea");

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  const nome = document.getElementById("nome").value.trim();
  const telefone = document.getElementById("tel").value.trim();
  const nick = document.getElementById("nick").value.trim();

  try {
    const res = await fetch(URL, {
      method: "POST",
      body: JSON.stringify({ nome, telefone, nick })
    });

    const texto = await res.text();

    if (texto === "LOTADO") {
      msg.innerHTML = "❌ A sala já está lotada.";
      return;
    }

    if (texto === "JA_ENTROU") {
      msg.innerHTML = "⚠️ Esse nick já foi cadastrado.";
      return;
    }

    // 🔥 MENSAGEM SIMPLES
    msg.innerHTML = "✅ Cadastro enviado!";

    // 🔥 MOSTRAR AREA PIX
    pixArea.style.display = "block";

    // 🔥 GERAR QR CODE
    document.getElementById("qrPix").src =
      `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${PIX}`;

    // 🔥 WHATSAPP
    const mensagem = `Olá, fiz o pagamento do Diário do DK.%0ANome: ${nome}%0ANick: ${nick}`;
    document.getElementById("linkZap").href =
      `https://wa.me/${TELEFONE}?text=${mensagem}`;

    // 🔥 SALVAR ESTADO
    localStorage.setItem("pixAtivo", "1");
    localStorage.setItem("nome", nome);
    localStorage.setItem("nick", nick);

    form.reset();
    carregar();

  } catch (err) {
    msg.innerHTML = "❌ Erro ao enviar cadastro.";
  }
});

function copiarPix() {
  navigator.clipboard.writeText(PIX);
  alert("Pix copiado!");
}

// 🔥 VOLTAR PRA TELA PIX SE RECARREGAR
window.onload = function () {
  if (localStorage.getItem("pixAtivo") === "1") {

    pixArea.style.display = "block";

    document.getElementById("qrPix").src =
      `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${PIX}`;

    const nome = localStorage.getItem("nome");
    const nick = localStorage.getItem("nick");

    const mensagem = `Olá, fiz o pagamento do Diário do DK.%0ANome: ${nome}%0ANick: ${nick}`;
    document.getElementById("linkZap").href =
      `https://wa.me/${TELEFONE}?text=${mensagem}`;
  }
};

async function carregar() {
  try {
    const res = await fetch(URL);
    const data = await res.json();

    lista.innerHTML = "";

    data.forEach(function(nick) {
      const li = document.createElement("li");
      li.textContent = nick;
      lista.appendChild(li);
    });

    const ocupadas = data.length;
    const restantes = TOTAL - ocupadas;

    ocupadasEl.textContent = ocupadas;
    restantesEl.textContent = restantes;
    fillEl.style.width = (ocupadas / TOTAL * 100) + "%";

    if (ocupadas >= TOTAL) {
      statusSala.textContent = "🔥 Sala lotada";
    } else if (restantes <= 2) {
      statusSala.textContent = "⚠️ Últimas vagas";
    } else {
      statusSala.textContent = "✅ Vagas abertas";
    }

  } catch (err) {
    statusSala.textContent = "❌ Erro ao carregar jogadores";
  }
}

carregar();
</script>
